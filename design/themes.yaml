# Temas adicionales sobre DESIGN.md (tema base = oscuro).
# - light: tema claro (Ruta B diurna, off-premise, consolas).
# - brands: capa de submarca. SOLO sobrescribe variables --color-brand-*.
#   Valores PROVISIONALES tomados de etiquetas públicas: validar con el manual de cada marca.
# En producción, las campañas pueden enviar overrides adicionales desde el CMS (tema de temporada).

