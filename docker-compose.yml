# Servicios locales para desarrollo: PostgreSQL 16 y Redis 7.
#   pnpm db:up            → levanta los servicios
#   pnpm db:migrate       → aplica migraciones a ilc_dev
# Credenciales solo para desarrollo local; nunca reutilizar en staging/producción.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ilc
      POSTGRES_PASSWORD: ilc
      POSTGRES_DB: ilc_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilc -d ilc_dev"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
