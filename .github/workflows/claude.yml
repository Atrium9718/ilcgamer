name: Claude (mantenimiento)

# Permite pedirle cambios a Claude desde GitHub: comenta `@claude <tarea>` en un issue o PR, o asigna el issue a `claude`.
# Requiere: (1) la app de GitHub de Claude instalada en el repositorio y (2) el secreto ANTHROPIC_API_KEY en Settings → Secrets.
# Claude trabaja en una rama y abre un PR; nada se publica ni se despliega sin la revisión y aprobación de una persona.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.assignee.login == 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ilc, POSTGRES_PASSWORD: ilc, POSTGRES_DB: ilc_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ilc -d ilc_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ilc:ilc@localhost:5432/ilc_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Solo personas con permiso de escritura en el repositorio pueden invocarlo (comportamiento por defecto de la acción).
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm:*),Bash(git:*),Bash(node:*),Bash(npx:*)"
            --max-turns 60
