name: Desplegar a staging (VPS)

# Staging en construcción (autorizado por la persona responsable del proyecto): se despliega solo cada vez que se sube código
# a la rama de trabajo, y también a mano (Actions → "Desplegar a staging") o desde el agente con una rama o etiqueta.
# Tras desplegar deja los datos de demostración. Para que no pida aprobación: GitHub → Settings → Environments → staging →
# quitar «Required reviewers». ANTES DE USUARIOS REALES: quitar el disparo por push y la carga de demostración (docs/DESPLIEGUE.md).
# Usa el entorno "staging" de GitHub: ahí viven los secretos y se puede exigir aprobación de una persona de TI.
# Secretos del entorno: VPS_HOST, VPS_USER, VPS_SSH_KEY (llave privada de un usuario sin root con acceso a Docker).
on:
  push:
    branches: [claude/mobile-app-planning-pgnveo]
  workflow_dispatch:
    inputs:
      ref:
        description: Rama o etiqueta a desplegar
        required: true
        default: main
      app_domain:
        description: "Opcional: nuevo dominio de la PWA (vacío = no cambiar)"
        required: false
        default: ""
      console_domain:
        description: "Opcional: nuevo dominio de la consola (vacío = no cambiar)"
        required: false
        default: ""
      demo_admins:
        description: "Correos administradores de la demostración, separados por espacio (vacío = no cargar la demostración)"
        required: false
        default: "andresepulveda718@gmail.com"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    steps:
      - name: Validar la referencia
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          APP_DOMAIN: ${{ inputs.app_domain }}
          CONSOLE_DOMAIN: ${{ inputs.console_domain }}
          DEMO_ADMINS: ${{ github.event_name == 'push' && 'andresepulveda718@gmail.com' || inputs.demo_admins }}
        run: |
          if ! printf '%s' "$DEMO_ADMINS" | grep -Eq '^[A-Za-z0-9@._+ -]{0,200}$'; then
            echo "Correos inválidos" >&2
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$'; then
            echo "Referencia inválida" >&2
            exit 1
          fi
          for d in "$APP_DOMAIN" "$CONSOLE_DOMAIN"; do
            if [ -n "$d" ] && ! printf '%s' "$d" | grep -Eq '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'; then
              echo "Dominio inválido" >&2
              exit 1
            fi
          done

      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Actualizar código y reconstruir en el servidor
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          APP_DOMAIN: ${{ inputs.app_domain }}
          CONSOLE_DOMAIN: ${{ inputs.console_domain }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "$VPS_USER@$VPS_HOST" bash -s -- "$REF" "$APP_DOMAIN" "$CONSOLE_DOMAIN" <<'REMOTE'
          set -euo pipefail
          REF="$1"; NEW_APP="${2:-}"; NEW_CONSOLE="${3:-}"
          cd /opt/ilc
          if [ -n "$NEW_APP" ]; then sed -i "s|^APP_DOMAIN=.*|APP_DOMAIN=$NEW_APP|" .env.production; fi
          if [ -n "$NEW_CONSOLE" ]; then sed -i "s|^CONSOLE_DOMAIN=.*|CONSOLE_DOMAIN=$NEW_CONSOLE|" .env.production; fi
          git fetch --tags origin "$REF"
          git checkout --detach FETCH_HEAD
          echo "Desplegando $(git rev-parse --short HEAD)"
          COMPOSE="sudo docker compose --env-file .env.production -f deploy/compose.prod.yml"
          $COMPOSE up -d --build
          $COMPOSE ps
          APP="$(grep '^APP_DOMAIN=' .env.production | cut -d= -f2)"
          for i in $(seq 1 30); do
            if curl -fsS "https://$APP/api/v1/health" >/dev/null; then echo "Salud: ok"; exit 0; fi
            sleep 5
          done
          echo "La API no respondió a tiempo" >&2
          $COMPOSE logs --tail=50 api >&2
          exit 1
          REMOTE

      - name: Cargar datos de demostración (staging)
        env:
          DEMO_ADMINS: ${{ github.event_name == 'push' && 'andresepulveda718@gmail.com' || inputs.demo_admins }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$DEMO_ADMINS" ]; then echo "Sin demostración"; exit 0; fi
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "$VPS_USER@$VPS_HOST" "cd /opt/ilc && bash deploy/staging_demo.sh $DEMO_ADMINS"
